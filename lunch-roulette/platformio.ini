; LilyGO TTGO T-Display (ESP32, 1.14" ST7789 135x240)
[env:t-display]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/Bodmer/U8g2_for_TFT_eSPI.git
build_flags =
    ; TFT_eSPI 설정 (라이브러리 파일을 직접 고치지 않도록 여기서 지정)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
